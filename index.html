<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Roblox Script Finder</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #007bff; color: #fff; cursor: pointer; }
    button:hover { background: #0056b3; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px solid #333; }
    .btn-copy { background: #28a745; margin-top: 10px; }
    .btn-copy:hover { background: #218838; }
  </style>
</head>
<body>

  <h2>🤖 Roblox Script Finder</h2>
  <div class="search-box">
    <input type="text" id="userInput" placeholder="พิมพ์ชื่อแมพ เช่น steel & egg...">
    <button onclick="getScript()">ค้นหาสคริปต์</button>
  </div>

  <div id="results"></div>

  <script>
    async function getScript() {
      const query = document.getElementById('userInput').value;
      const resultsDiv = document.getElementById('results');
      
      if (!query) return alert('กรุณาพิมพ์ชื่อแมพก่อนครับ');
      
      resultsDiv.innerHTML = 'กำลังค้นหา...';

      try {
        // เปลี่ยน URL ตรงนี้เป็น API หลังบ้านของคุณ
        // const response = await fetch(`/api/search?map=${encodeURIComponent(query)}`);
        // const data = await response.json();

        // ตัวอย่าง Simulation การส่งข้อมูลกลับจาก API
        setTimeout(() => {
          const fakeScript = `loadstring(game:HttpGet("https://raw.githubusercontent.com/Example/SteelAndEgg/main/script.lua"))()`;
          
          resultsDiv.innerHTML = `
            <div class="card">
              <h3>สคริปต์สำหรับ: ${query}</h3>
              <p><strong>ฟีเจอร์:</strong> Auto Farm, Auto Hatch, ESP</p>
              <textarea readonly style="width:100%; height:60px; background:#111; color:#00ff00; border:none; padding:5px;">${fakeScript}</textarea>
              <br>
              <button class="btn-copy" onclick="copyToClipboard('${fakeScript}')">📋 กดเพื่อคัดลอกสคริปต์</button>
            </div>
          `;
        }, 500);

      } catch (error) {
        resultsDiv.innerHTML = 'เกิดข้อผิดพลาดในการดึงข้อมูล';
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text);
      alert('คัดลอกสคริปต์เรียบร้อยแล้ว!');
    }
  </script>
</body>
</html>
